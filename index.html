<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Next Obsession Starts Here | Manga Store</title>
    <meta name="description" content="Explore our curated selection of manga and find your next favorite series.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Navigation Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <div class="nav-avatar">
                <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
                    <circle cx="18" cy="18" r="18" fill="#111"/>
                    <circle cx="18" cy="14" r="6" fill="#fff"/>
                    <ellipse cx="18" cy="28" rx="10" ry="7" fill="#fff"/>
                </svg>
            </div>
            <a href="#" class="nav-link nav-dropdown">
                Library
                <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M3 5L6 8L9 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <a href="#" class="nav-link">Recommended</a>
        </div>
        <div class="nav-right">
            <a href="#" class="nav-btn">Cart</a>
            <a href="#" class="nav-btn">Sign in</a>
        </div>
    </nav>

    <!-- Manga Cover Collage -->
    <div class="collage" id="collage">
        <!-- Top-left cluster -->
        <div class="manga-card card-1">
            <img src="img1.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-2">
            <img src="img2.jpeg" alt="Manga cover">
        </div>
        <!-- Left cluster -->
        <div class="manga-card card-3">
            <img src="img3.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-4">
            <img src="img1.jpeg" alt="Manga cover">
        </div>
        <!-- Bottom-left cluster -->
        <div class="manga-card card-5">
            <img src="img2.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-6">
            <img src="img3.jpeg" alt="Manga cover">
        </div>
        <!-- Top-right cluster -->
        <div class="manga-card card-7">
            <img src="img1.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-8">
            <img src="img2.jpeg" alt="Manga cover">
        </div>
        <!-- Right cluster -->
        <div class="manga-card card-9">
            <img src="img3.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-10">
            <img src="img1.jpeg" alt="Manga cover">
        </div>
        <!-- Bottom-right cluster -->
        <div class="manga-card card-11">
            <img src="img2.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-12">
            <img src="img3.jpeg" alt="Manga cover">
        </div>
        <!-- Bottom center -->
        <div class="manga-card card-13">
            <img src="img1.jpeg" alt="Manga cover">
        </div>
        <div class="manga-card card-14">
            <img src="img2.jpeg" alt="Manga cover">
        </div>
    </div>

    <!-- Hero Content (center) -->
    <main class="hero" id="hero">
        <h1 class="hero-heading" id="heroHeading">
            Your next obsession<br>
            <span class="underline-wrap">starts here.</span>
        </h1>
        <p class="hero-sub" id="heroSub">
            Explore our curated selection of manga and find your<br>next favorite series.
        </p>
        <div class="hero-buttons" id="heroButtons">
            <a href="#" class="btn btn-primary" id="btnProduct">
                See product
                <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="3" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                    <rect x="5" y="1" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
                </svg>
            </a>
            <a href="#" class="btn btn-secondary" id="btnManga">
                Manga of the month
                <span class="sparkles">
                    <svg class="sparkle s1" width="10" height="10" viewBox="0 0 10 10"><path d="M5 0L6 4L10 5L6 6L5 10L4 6L0 5L4 4Z" fill="currentColor"/></svg>
                    <svg class="sparkle s2" width="7" height="7" viewBox="0 0 10 10"><path d="M5 0L6 4L10 5L6 6L5 10L4 6L0 5L4 4Z" fill="currentColor"/></svg>
                    <svg class="sparkle s3" width="5" height="5" viewBox="0 0 10 10"><path d="M5 0L6 4L10 5L6 6L5 10L4 6L0 5L4 4Z" fill="currentColor"/></svg>
                </span>
            </a>
        </div>
    </main>

    <!-- SVG for wavy underline -->
    <svg class="wavy-svg" id="wavySvg" viewBox="0 0 220 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="wavyPath" d="M2 8 C 20 2, 40 12, 60 6 S 100 2, 120 8 S 160 12, 180 6 S 200 2, 218 8" stroke="#111" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </svg>

    <script src="script.js"></script>
</body>
</html>
