<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- ── Security headers ── -->
  <!-- CSP: lockdown what can execute, load, or connect -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self';
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com;
    img-src     'self' data: blob:;
    connect-src 'self' https://api.emailjs.com;
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <!-- Prevent Referer header leaking the full URL to third parties -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- ── End security headers ── -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echidna.in | Custom Sublimation Printing</title>
  <meta name="description"
    content="Premium custom sublimation prints from Echidna.in. High-quality mugs, shirts, hoodies, and more. Shop now for vivid, fade-resistant merchandise.">
  <meta name="keywords" content="sublimation printing, custom mugs, custom hoodies, custom shirts, anime merchandise, print studio">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://echidna.in/">
  <meta property="og:title" content="Echidna.in | Custom Sublimation Printing">
  <meta property="og:description" content="Premium custom sublimation prints from Echidna.in. High-quality mugs, shirts, hoodies, and more. Shop now for vivid, fade-resistant merchandise.">
  <meta property="og:image" content="https://echidna.in/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://echidna.in/">
  <meta property="twitter:title" content="Echidna.in | Custom Sublimation Printing">
  <meta property="twitter:description" content="Premium custom sublimation prints from Echidna.in. High-quality mugs, shirts, hoodies, and more. Shop now for vivid, fade-resistant merchandise.">
  <meta property="twitter:image" content="https://echidna.in/og-image.jpg">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
